name: Build signed Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Install Android SDK command-line tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="$RUNNER_TEMP/apd-android-sdk"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$SDK_ROOT/cmdline-tools/latest"
          curl --fail --location --retry 3 \
            "https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip" \
            --output "$RUNNER_TEMP/android-commandline-tools.zip"
          unzip -q "$RUNNER_TEMP/android-commandline-tools.zip" -d "$RUNNER_TEMP/android-cli"
          cp -r "$RUNNER_TEMP/android-cli/cmdline-tools/." "$SDK_ROOT/cmdline-tools/latest/"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --version
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses
          result=${PIPESTATUS[1]}
          set -o pipefail
          test "$result" -eq 0
      - name: Install Android build dependencies
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - name: Configure local SDK paths
        run: |
          python3 - <<'PYCONFIG'
          import os
          import pathlib
          import shutil

          flutter = pathlib.Path(shutil.which("flutter")).resolve().parent.parent
          sdk = os.environ.get("ANDROID_HOME") or os.environ["ANDROID_SDK_ROOT"]
          pathlib.Path("android/local.properties").write_text(f"flutter.sdk={flutter}\nsdk.dir={sdk}\n")
          PYCONFIG
          chmod +x android/gradlew
      - name: Test and build signed release
        env:
          APD_KEYSTORE_BASE64: ${{ secrets.APD_KEYSTORE_BASE64 }}
          APD_STORE_PASSWORD: ${{ secrets.APD_STORE_PASSWORD }}
          APD_KEY_ALIAS: ${{ secrets.APD_KEY_ALIAS }}
          APD_KEY_PASSWORD: ${{ secrets.APD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${APD_KEYSTORE_BASE64:?Add the original release keystore as APD_KEYSTORE_BASE64}"
          : "${APD_STORE_PASSWORD:?Add APD_STORE_PASSWORD}"
          : "${APD_KEY_ALIAS:?Add APD_KEY_ALIAS}"
          : "${APD_KEY_PASSWORD:?Add APD_KEY_PASSWORD}"
          umask 077
          export APD_KEYSTORE
          APD_KEYSTORE="$(mktemp "$RUNNER_TEMP/apd-release.XXXXXX")"
          trap 'rm -f -- "$APD_KEYSTORE"' EXIT
          printf '%s' "$APD_KEYSTORE_BASE64" | base64 --decode > "$APD_KEYSTORE"
          unset APD_KEYSTORE_BASE64
          bash tools/build_release.sh
      - name: Validate APK and signing certificate
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK unavailable}}"
          apk=build/app/outputs/flutter-apk/app-release.apk
          python3 tools/verify_apk.py "$apk" --build-tools "$sdk/build-tools/36.0.0" \
            --output release/verification --require-camera
          python3 tools/check_release_identity.py pubspec.yaml release/verification docs/evidence-v0.13.0
          version="$(sed -nE 's/^version:[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+)\+[0-9]+$/\1/p' pubspec.yaml)"
          test -n "$version"
          cp "$apk" "release/AI_Photography_Director_v$version.apk"
      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Photography-Director-APK
          path: release/
          if-no-files-found: error
