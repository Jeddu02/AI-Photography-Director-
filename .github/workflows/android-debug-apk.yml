name: Build debug Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Install Android SDK command-line tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="$RUNNER_TEMP/apd-android-sdk"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$SDK_ROOT/cmdline-tools/latest"
          curl --fail --location --retry 3 \
            "https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip" \
            --output "$RUNNER_TEMP/android-commandline-tools.zip"
          unzip -q "$RUNNER_TEMP/android-commandline-tools.zip" -d "$RUNNER_TEMP/android-cli"
          cp -r "$RUNNER_TEMP/android-cli/cmdline-tools/." "$SDK_ROOT/cmdline-tools/latest/"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --version
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses
          result=${PIPESTATUS[1]}
          set -o pipefail
          test "$result" -eq 0
      - name: Install Android build dependencies
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - name: Configure local SDK paths
        run: |
          python3 - <<'PYCONFIG'
          import os
          import pathlib
          import shutil
          flutter = pathlib.Path(shutil.which("flutter")).resolve().parent.parent
          sdk = os.environ.get("ANDROID_HOME") or os.environ["ANDROID_SDK_ROOT"]
          pathlib.Path("android/local.properties").write_text(f"flutter.sdk={flutter}\\nsdk.dir={sdk}\\n")
          PYCONFIG
          chmod +x android/gradlew
      - name: Resolve Flutter packages
        run: flutter pub get
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Verify APK exists
        run: |
          test -s build/app/outputs/flutter-apk/app-debug.apk
          ls -lh build/app/outputs/flutter-apk/app-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Photography-Director-Debug-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
